# 主题 anzhiyu 覆盖配置（与 node_modules/hexo-theme-anzhiyu/_config.yml 深度合并）

# CDN 覆盖：twikoo 前端必须用 2.0.x 与 2.0 后端协议匹配（主题默认 1.6.44 不兼容）
CDN:
  option:
    twikoo: https://cdn.cbd.int/twikoo@2.0.17/dist/twikoo.all.min.js
    # 音乐 API：自建 Cloudflare Worker 代理（音乐元数据走边缘缓存，音频 302 直连音源）
    meting_api: "https://music.delicious-pigeonking.blog/api?server=:server&type=:type&id=:id&r=:r"

# 评论系统：Twikoo（后端部署在 Cloudflare Workers + D1）
comments:
  use: Twikoo
  text: true
  lazyload: false
  count: true
  card_post_count: true

twikoo:
  envId: https://twikoo.delicious-pigeonking.blog
  region:
  visitor: true
  option:
    lang: zh-CN
    placeholder: 欢迎留下宝贵的建议啦~

# 留言弹幕（基于 Twikoo 评论数据滚动）
comment_barrage_config:
  enable: true
  maxBarrage: 1
  barrageTime: 4000
  accessToken: ""
  mailMd5: ""

# 文章底部版权卡片（作者 / 位置 / 许可协议）
# 主题默认 location 是「长沙」（主题作者的所在地），改成实际所在地
post_copyright:
  enable: true
  decode: false
  author_href: /
  location: 天津
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  avatarSinks: false
  copyright_author_img_back:
  copyright_author_img_front:
  copyright_author_link: /

# 头像
avatar:
  img: /img/avatar.jpg
  effect: false

# 加载动画头像
preloader:
  enable: true
  source: 3
  pace_css_url:
  avatar: /img/avatar.jpg

# ============ 音乐系统 ============
# 左下角音乐胶囊（全站常驻播放器）
nav_music:
  enable: true
  console_widescreen_music: false
  # 歌单 id：网易云歌单（替换成自己的歌单 id 即可，见 README 音乐章节）
  id: 8399964650
  server: netease
  volume: 0.7
  # 「播放全部」跳转的网易云歌单地址
  all_playlist: https://music.163.com/#/playlist?id=8399964650

# /music 音乐馆默认加载的歌单来源：nav_music = 与胶囊同一个歌单
music_page_default: nav_music

# 首页顶部：原「新品主题 Theme-AnZhiYu」主题展示卡改为随笔捡拾入口
home_top:
  # 左侧标题区（关闭 peoplecanvas 后显示文字，否则只渲染空白画布）
  title: 鸽王的小站
  subTitle: 记录代码、美食与热爱
  siteText: 天津 · 欢迎随便逛逛
  banner:
    tips: 随笔捡拾
    title: 五湖四海的碎片
    image: /img/essay.svg
    link: /essay/

# 关闭主题默认的人群 canvas 动画（其素材来自米游社 CDN，加载失败时左侧首页卡片呈空白）
peoplecanvas:
  enable: false

# ============ 导航菜单 ============
menu:
  文章:
    归档: /archives/ || anzhiyu-icon-box-archive
    分类: /categories/ || anzhiyu-icon-shapes
    标签: /tags/ || anzhiyu-icon-tags
  友链:
    友人帐: /link/ || anzhiyu-icon-link
    留言板: /comments/ || anzhiyu-icon-envelope
  我的:
    音乐馆: /music/ || anzhiyu-icon-music
    随笔捡拾: /essay/ || anzhiyu-icon-pencil
  关于:
    关于本站: /about/ || anzhiyu-icon-paper-plane
    我的装备: /equipment/ || anzhiyu-icon-camera
    随便逛逛: /random/ || anzhiyu-icon-dice

# ============ 侧边栏作者卡片 ============
# 社交链接（决定作者卡底部站名/签名区是否渲染）
social:
  Github: https://github.com/pigeonkingjrz || anzhiyu-icon-github
  Email: mailto:2581705325@qq.com || anzhiyu-icon-envelope

# 开启「欢迎光临」状态徽章（文案轮换自 skills 列表，点击卡片徽章可手动切换）
author_status:
  enable: true
  skills:
    - 欢迎光临
    - 今天也要加油鸭
    - 芳华待灼，砥砺深耕
    - 欢迎再来

# 注入自定义样式与脚本（作者卡橙色渐变、徽章固定显示「欢迎光临」）
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script>(function(){function f(){var e=document.getElementById("author-info__sayhi");if(e)e.textContent="欢迎光临"}window.addEventListener("load",f);document.addEventListener("DOMContentLoaded",f);document.addEventListener("pjax:complete",f)})();</script>

# ============ 页脚 ============
footer:
  # 版权信息（footerBar 开启时显示在底栏）
  owner:
    enable: true
    since: 2026
  # 绿点状态文字（值必须加引号，避免 YAML 把 #4caf50 当注释截断）
  custom_text: '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:6px;box-shadow:0 0 6px #4caf50"></span>所有业务正常'
  runtime:
    enable: false
  # 社交图标行（中间为头像，点击回顶部）
  socialBar:
    enable: true
    centerImg: /img/avatar.jpg
    left:
      - title: 邮箱
        link: mailto:2581705325@qq.com
        icon: anzhiyu-icon-envelope
      - title: RSS
        link: atom.xml
        icon: anzhiyu-icon-rss
    right:
      - title: Github
        link: https://github.com/pigeonkingjrz
        icon: anzhiyu-icon-github
      - title: 音乐馆
        link: /music/
        icon: anzhiyu-icon-music
      - title: 留言板
        link: /comments/
        icon: anzhiyu-icon-pencil
  # 链接分栏 + 友链随机换一批
  list:
    enable: true
    randomFriends: 3
    project:
      - title: 文章
        links:
          - title: 归档
            link: /archives/
          - title: 分类
            link: /categories/
          - title: 标签
            link: /tags/
      - title: 导航
        links:
          - title: 随笔捡拾
            link: /essay/
          - title: 音乐馆
            link: /music/
          - title: 留言板
            link: /comments/
          - title: 我的装备
            link: /equipment/
      - title: 关于
        links:
          - title: 关于本人
            link: /about/
          - title: 友人帐
            link: /link/
  # 底部版权栏
  footerBar:
    enable: true
    authorLink: /
    cc:
      enable: false
      link: /about/
    linkList:
      - link: /comments/
        text: 留言
      - link: /
        text: 主页
